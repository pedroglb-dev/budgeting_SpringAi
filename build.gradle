plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id("io.freefair.lombok") version "9.8.3"
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'budgeting'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation platform("org.springframework.ai:spring-ai-bom:2.1.0") //bom = build of material
    implementation'org.springframework.ai:spring-ai-starter-model-google-genai' //google ai studio que e de graca
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-transcription' //transcricao do genai

    implementation'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai-tts'
}

tasks.named('test') {
    useJUnitPlatform()
}
