spring.application.name=budgeting
spring.ai.google.genai.api-key=${GENAI_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.temperature=0.8

spring.ai.retry.max-attempts=3

logging.level.org.springframework.ai=DEBUG

spring.ai.model.audio.transcription=google-genai

spring.ai.google.genai.transcription.api-key=${GENAI_API_KEY}
spring.ai.google.genai.transcription.model=gemini-3.5-transcribe-live
spring.ai.google.genai.transcription.language=pt-BR
spring.ai.google.genai.transcription.temperature=0
spring.ai.google.genai.transcription.prompt=Audio em Portugues brasileiro. Audio contem descricao de gastos financeiros \
  as frases normalmente contem um valor em reais( numero + reais);\
  uma acao (gastei, paguei, comprei);\
  um local ou estabelecimento(mercado, farmacia, posto de gasolina, restaurante loja, etc...).

spring.ai.model.audio.speech=google-genai
spring.ai.google.genai.tts.model=gemini-2.5-flash-preview-tts
spring.ai.google.genai.tts.voice-name=Kore
spring.ai.google.genai.tts.language-code=pt-BR